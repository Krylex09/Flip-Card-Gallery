<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://www.uit.edu.vn/media/Logo_UIT_In_bde69cac47.jpg">
</head>
<body>
    <header>
<div class="header-box">
  <h1>Flip Card Gallery</h1>
  <p>Hover the card to see the back</p>
</div>
<div class="gallery-container">
    <!-- Card 1: HTML -->
    <div class="card-container">
      <div class="card-inner">
        <div class="card-front">
          <div class="card-icon">📡</div>
          <h2>HTML</h2>
        </div>
        <div class="card-back">
          <h3>More detail...</h3>
        </div>
      </div>
    </div>

    <!-- Card 2: CSS -->
    <div class="card-container">
      <div class="card-inner">
        <div class="card-front">
          <div class="card-icon">🎨</div>
          <h2>CSS</h2>
        </div>
        <div class="card-back">
          <h3>More detail...</h3>
        </div>
      </div>
    </div>

    <!-- Card 3: JavaScript -->
    <div class="card-container">
      <div class="card-inner">
        <div class="card-front">
          <div class="card-icon">⚡</div>
          <h2>JavaScript</h2>
        </div>
        <div class="card-back">
          <h3>More detail...</h3>
        </div>
      </div>
    </div>
</div>
</header>
</body>
